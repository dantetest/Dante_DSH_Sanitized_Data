name: build-desktop

# 用途：在 GitHub 的 macOS 机器上打出「免签名测试包」，不需要苹果开发者账号。
#
# 产物：Sanitized_Data-arm64.dmg（Apple Silicon）/ Sanitized_Data-x64.dmg（Intel）
# 测试者打开方式：右键 → 打开；或终端执行
#   xattr -dr com.apple.quarantine /Applications/Sanitized_Data.app
#
# 触发：
#   - push 到 main：只出 arm64（快，日常够用）
#   - 手动 Run workflow：可选是否同时出 Intel 包
#   - 打 v* 标签：两个架构都出，并挂到 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # ── Apple Silicon：每次必建 ──
  macos-arm64:
    name: macOS (arm64)
    runs-on: macos-14
    defaults:
      run:
        working-directory: Sanitized_Data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/server/requirements.txt
          python -m pip install pyinstaller pywebview

      - name: PyInstaller 打包
        run: python -m PyInstaller --clean --noconfirm desktop/app.spec

      - name: ad-hoc 签名（arm64 必须，否则无法运行）
        run: |
          codesign --force --deep --sign - "dist/Sanitized_Data.app"
          codesign --verify --deep --verbose=2 "dist/Sanitized_Data.app" || true

      - name: 打包 DMG
        run: |
          hdiutil create -volname "Sanitized_Data" \
            -srcfolder "dist/Sanitized_Data.app" \
            -ov -format UDZO "Sanitized_Data-arm64.dmg"
          ls -lh *.dmg

      - name: 冒烟测试（能起 + 插件齐全）
        run: |
          mkdir -p /tmp/smoke
          hdiutil attach "Sanitized_Data-arm64.dmg" -mountpoint /tmp/smoke -nobrowse
          cp -R "/tmp/smoke/Sanitized_Data.app" /tmp/app.app || cp -R /tmp/smoke/*.app /tmp/app.app
          hdiutil detach /tmp/smoke -quiet || true
          /tmp/app.app/Contents/MacOS/Sanitized_Data &
          APP_PID=$!
          sleep 20
          python3 ../.github/scripts/smoke_check.py
          kill $APP_PID || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: Sanitized_Data/Sanitized_Data-arm64.dmg
          if-no-files-found: error

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sanitized_Data/Sanitized_Data-arm64.dmg

  # ── Intel：只在打标签时自动建；手动触发时也会建 ──
  macos-x64:
    name: macOS (x64)
    runs-on: macos-13
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: Sanitized_Data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/server/requirements.txt
          python -m pip install pyinstaller pywebview

      - name: PyInstaller 打包
        run: python -m PyInstaller --clean --noconfirm desktop/app.spec

      - name: ad-hoc 签名
        run: |
          codesign --force --deep --sign - "dist/Sanitized_Data.app"

      - name: 打包 DMG
        run: |
          hdiutil create -volname "Sanitized_Data" \
            -srcfolder "dist/Sanitized_Data.app" \
            -ov -format UDZO "Sanitized_Data-x64.dmg"

      - name: 冒烟测试（能起 + 插件齐全）
        run: |
          mkdir -p /tmp/smoke
          hdiutil attach "Sanitized_Data-x64.dmg" -mountpoint /tmp/smoke -nobrowse
          cp -R "/tmp/smoke/Sanitized_Data.app" /tmp/app.app || cp -R /tmp/smoke/*.app /tmp/app.app
          hdiutil detach /tmp/smoke -quiet || true
          /tmp/app.app/Contents/MacOS/Sanitized_Data &
          APP_PID=$!
          sleep 20
          python3 ../.github/scripts/smoke_check.py
          kill $APP_PID || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: Sanitized_Data/Sanitized_Data-x64.dmg
          if-no-files-found: error

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sanitized_Data/Sanitized_Data-x64.dmg
