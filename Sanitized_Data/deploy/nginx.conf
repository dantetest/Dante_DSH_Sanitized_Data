# 数据隐站 · nginx 反向代理示例
#
# 关键点：
#   1. proxy_set_header Host 必须传真实域名（或至少配 X-Forwarded-Host），
#      否则服务端做同源校验时会认为 Origin 与 Host 不符，返回「跨站请求被拒绝」。
#   2. client_max_body_size 要够大，扫描件动辄几十 MB。
#   3. 关闭 proxy_buffering 并加长超时，OCR 单页可能几秒到十几秒。

server {
    listen 8443 ssl;
    server_name cka.blctek.com;

    ssl_certificate     /etc/nginx/ssl/cka.blctek.com.crt;
    ssl_certificate_key /etc/nginx/ssl/cka.blctek.com.key;

    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8760;
        proxy_http_version 1.1;

        # ↓↓↓ 这两行是「跨站请求被拒」的关键
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
