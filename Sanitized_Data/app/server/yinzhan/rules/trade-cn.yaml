# 进出口贸易 · 单证（trade-cn）
#
# 来源：docs/research/05-进出口贸易单证脱敏清单与方案.md §5 的 P0 子集
# 扩展点：docs/red-lines.md E4（规则按域独立；共享的 regex_det.py 由 Lead 维护）
# 校验器：app/server/yinzhan/detectors/trade_validators.py（load_plugins 自动导入注册）
#
# 设计取舍（P0）：
#   * 每条规则都带 near 上下文或强结构，避免在非贸易文件上误报；
#   * 号码类一律挂 validate（校验不过直接丢弃候选），换名后仍保持"看起来合法"；
#   * keep = 显式保留项（HS/价格条款/船名/出口管制提示），只标记不修改；
#     pipeline.verify 会跳过 keep 实体，不视为残留（Lead 已修）；
#   * 以下规则留到 P1（依赖 field_det / 词典 / 跨单证引擎）：
#       信用证号、英文/中文银行账号、港口词典、最终用户字段值、原产地证号专门格式；
#   * SWIFT/BIC 已由财务域 finance-cn 的 cn.swift_bic（priority 105）+ 其
#     finance_validators.swift_bic（含 ISO 3166 国别码）覆盖，本包不重复定义，
#     避免两条同形态规则互相抢 span；
#   * 不在本包做"换名保形"的金额联动/大写重算（P1/P2，见 docs/impl/trade.md）。

pack: trade-cn
name: 进出口贸易 · 单证
version: 1
include: [common]

rules:
  # ── 0. 合规提示型：命中即标记（keep），提醒审核人该文件含出口管制信息 ──
  - id: trade.export_control_hint
    entity: CONTROL_HINT
    label: 出口管制提示
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 130
    detect:
      - type: dict
        words: [最终用户, 最终用途, 两用物项, 出口管制, 管制清单, 管控名单,
                最终收货人, 最终使用者, END USER, END-USE, ENDUSER,
                EXPORT CONTROL, DUAL-USE, DUAL USE]
    replace: {strategy: keep}

  # ── 1. 号码类（贸易单证特有） ──
  # ISO 6346：3 位箱主代码 + 1 位设备类别 U/J/Z + 6 位序列 + 1 位校验
  - id: trade.container_no
    entity: CONTAINER_NO
    label: 集装箱号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 118
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z]{3}[UJZ][0-9]{7}(?![0-9A-Za-z])'
        flags: I
        validate: iso6346_container
        near: [集装箱, 箱号, 柜号, CONTAINER, 箱体, 箱量, 柜型]
        near_before: 16
        near_after: 8
        confidence: 0.95
    replace: {strategy: surrogate}

  # 报关单号/预录入编号：4 关区 + 4 年份 + 1 进出口标志(1/0/I/E) + 9 顺序号
  - id: trade.declaration_no
    entity: DECL_NO
    label: 报关单号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 116
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])\d{4}(?:19|20)\d{2}[01IE]\d{9}(?![0-9A-Za-z])'
        flags: I
        validate: customs_decl_no
        near: [报关单, 海关编号, 预录入, 报关单号, 申报编号]
        near_before: 14
        near_after: 6
        confidence: 0.92
    replace: {strategy: surrogate}

  # IATA 空运单号：3 位航司代码 + 7 位序列 + 1 位校验（前 10 位 mod 7）
  - id: trade.awb_no
    entity: AWB_NO
    label: 空运单号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 114
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])\d{3}[-\s]?\d{8}(?![0-9A-Za-z])'
        validate: awb_no
        near: [空运, 航空, 运单, AWB, MAWB, HAWB, 航班, 航空货运]
        near_before: 16
        near_after: 8
        confidence: 0.90
    replace: {strategy: surrogate}

  # 海运提单号：承运人前缀（3-4 字母）+ 序列（6-12 位）
  - id: trade.bl_no
    entity: BL_NO
    label: 提单号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 112
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z]{3,4}[0-9]{6,12}(?![0-9A-Za-z])'
        flags: I
        validate: bl_no
        near: [提单, 运单, 提运单号, B/L, BILL OF LADING, WAYBILL, 电放, 海运单]
        near_before: 20
        near_after: 8
        confidence: 0.88
    replace: {strategy: surrogate}

  # 许可证号：格式随发证机关变化，没有统一校验位；默认涂黑（L3）
  - id: trade.license_no
    entity: LICENSE
    label: 许可证号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 108
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z0-9]{2,6}[-/][A-Z0-9]{4,14}(?![0-9A-Za-z])'
        flags: I
        validate: license_no
        near: [许可证号, 许可证编号, 出口许可证, 进口许可证, 两用物项, 配额证, 许可证]
        near_before: 12
        near_after: 4
        confidence: 0.80
    replace: {strategy: black}

  # 商业发票号/形式发票号（保形换名；与合同号等共用 P1 的批级映射）
  - id: trade.invoice_no
    entity: INVOICE_NO
    label: 发票号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 96
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:INV|PI|CI)[-_/]?[A-Z0-9]{2,4}[-_/]?[0-9]{2,10}(?![0-9A-Za-z])'
        flags: I
        validate: trade_invoice_no
        near: [发票, INVOICE, INV NO, 发票号, 形式发票, PROFORMA]
        near_before: 20
        near_after: 6
        confidence: 0.80
    replace: {strategy: surrogate}

  # 合同号/订单号（保形换名）
  - id: trade.contract_no
    entity: CONTRACT_NO
    label: 合同号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 94
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z]{2,6}[-_/]?(?:19|20)?\d{2}[-_/][A-Z0-9]{3,12}(?![0-9A-Za-z])'
        flags: I
        validate: contract_no
        near: [合同号, 合同编号, 协议号, CONTRACT NO, S/C NO, P/O NO, 订单号]
        near_before: 20
        near_after: 6
        confidence: 0.80
    replace: {strategy: surrogate}

  # 原产地证书号（CO / Form E / RCEP 等；保形换名）
  - id: trade.origin_cert_no
    entity: ORIGIN_CERT_NO
    label: 原产地证号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 90
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z]{1,6}[-/]?[0-9]{4,10}(?:[-/][0-9]{2,10})?(?![0-9A-Za-z])'
        flags: I
        validate: origin_cert_no
        near: [原产地, 产地证, FORM A, FORM E, RCEP, CERTIFICATE OF ORIGIN, 原产地证书]
        near_before: 16
        near_after: 6
        confidence: 0.80
    replace: {strategy: surrogate}

  # 封条号/关锁号（无统一校验位；排除集装箱形态后保形换名）
  - id: trade.seal_no
    entity: SEAL_NO
    label: 封条号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 92
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[A-Z]{2,4}[0-9]{6,12}(?![0-9A-Za-z])'
        flags: I
        validate: seal_no
        near: [封条, 铅封, 关锁, SEAL, 海关封, 封识]
        near_before: 14
        near_after: 6
        confidence: 0.85
    replace: {strategy: surrogate}

  # ── 2. 主体/金额类 ──
  # 英文公司名（贸易单证大量使用 ABC TRADING CO., LTD. 形态）
  - id: trade.org_en
    entity: ORG
    label: 英文机构名
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 76
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])(?:[A-Z][A-Za-z0-9&.,()\- ]{1,60}?)\s(?:CO\.?,?\s*LTD\.?|LIMITED|LTD\.?|INC\.?|CORP\.?|CORPORATION|GMBH|B\.?V\.?|N\.?V\.?|S\.?A\.?|S\.?R\.?L\.?|LLC|LP|PTE\.?\s*LTD\.?|SDN\.?\s*BHD\.?)(?![A-Za-z])'
        flags: I
        confidence: 0.85
    replace: {strategy: surrogate}

  # 外币金额（USD/EUR/... + 数字）；人民币金额由 common 的 cn.amount 负责
  - id: trade.amount_fx
    entity: AMOUNT
    label: 外币金额
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 88
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:USD|EUR|GBP|JPY|HKD|AUD|CAD|CHF|SGD|CNY|RMB)\s*[:：]?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?(?![0-9])'
        flags: I
        confidence: 0.90
    replace: {strategy: surrogate}

  # ── 3. 只标记、不修改（keep）：业务必需但可能属商业情报，导出前给用户看清单 ──
  # HS 编码：换码 = 改归类/税率/监管条件，禁止换名；只识别并保留
  - id: trade.hs_code
    entity: HS_CODE
    label: HS 编码
    level: L1
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 60
    detect:
      - type: regex
        pattern: '(?<![0-9])[0-9]{4}\.?[0-9]{2}\.?[0-9]{2}(?:\.?[0-9]{2})?(?![0-9])'
        validate: hs_code
        near: [HS, 税号, 商品编号, 海关编码, 归类, 税则号列, 商品编码, 海关商品编号]
        near_before: 12
        near_after: 6
        confidence: 0.85
    replace: {strategy: keep}

  # 价格条款/贸易术语：业务必需，保留
  - id: trade.price_term
    entity: TRADE_TERM
    label: 价格条款
    level: L1
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 52
    detect:
      - type: regex
        pattern: '(?<![A-Z])(?:FOB|CIF|CFR|CIP|CPT|EXW|FCA|DDP|DAP|FAS)(?![A-Z])'
        flags: I
        near: [价格条款, 成交方式, 贸易术语, 价格, 条款, 报价]
        near_before: 16
        near_after: 6
        confidence: 0.85
    replace: {strategy: keep}

  # 船名/航次/航班：保留（对外版本可人工改黑）
  - id: trade.vessel_voyage
    entity: VESSEL
    label: 船名/航次/航班
    level: L1
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 50
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[A-Z][A-Z0-9 .\-]{2,30}[/\-][A-Z0-9]{2,8}(?![A-Za-z0-9])'
        flags: I
        near: [船名, 航次, 航班, VESSEL, VOYAGE, V/V, FLIGHT, 船名航次]
        near_before: 14
        near_after: 6
        confidence: 0.80
    replace: {strategy: keep}
