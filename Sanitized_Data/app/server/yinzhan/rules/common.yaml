# 通用 · 个人信息
# 所有行业包都 include 本包；这里只放"任何文件类型都可能出现"的 PII。
pack: common
name: 通用 · 个人信息
version: 1

rules:
  # ── 凭据类：绝不允许原文进入上下文，直接涂黑 ──
  - id: cn.private_key
    entity: SECRET
    label: 私钥
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 135
    detect:
      - type: regex
        pattern: '-----BEGIN (?:[A-Z]+ )*PRIVATE KEY-----'
    replace: {strategy: black}

  - id: cn.secret
    entity: SECRET
    label: 密钥/令牌
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 130
    detect:
      - type: regex
        pattern: '(?:sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|(?:ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]{16,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_\-]{30,})'
    replace: {strategy: black}

  # ── 证件与号码 ──
  - id: cn.idcard
    entity: ID_CARD
    label: 身份证号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 120
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[1-9]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?![0-9A-Za-z])'
        validate: cn_id_checksum
    replace: {strategy: surrogate}

  # 身份证形状兜底（2026-10-23，隐私优先的校验位策略）：
  # GB 11643 校验位/出生日期不合法时 cn.idcard 会整串丢弃（validate 语义见
  # docs/qa/idcard-checksum-policy-20261023.md），OCR 误识、手工录错、伪造号、
  # 日期越界都会因此漏遮。这里用同一条 shape 正则兜一层：只在 cn_id_checksum
  # 不通过时命中（校验通过的仍走上一条规则，高置信 accepted，不会重复实体），
  # 置信度压到 0.66 —— standard/strict 档进入「待确认」人工复核，不静默丢弃；
  # human 导出照常涂黑、AI 导出照常换成合法假号（pending 实体在 decide 阶段
  # 已拿到 surrogate 决策，导出链路与 accepted 一致）。
  # 刻意不限定 near 上下文：脱敏场景里表格单元格、日志、聊天记录、OCR 断行
  # 里的裸号正是最危险的泄漏面，不能要求一定出现「身份证」标签。
  - id: cn.idcard_shape
    entity: ID_CARD
    label: 身份证号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 118
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[1-9]\d{5}(?:18|19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?![0-9A-Za-z])'
        # 校验位合法的值由 cn.idcard 以 0.99 accepted；这里只兜「形状像但校验不通过」，
        # 避免同一值被两条规则各出一个实体、也避免把合法身份证降成 pending。
        unless_validate: cn_id_checksum
        confidence: 0.66
    replace: {strategy: surrogate}

  - id: cn.bankcard
    entity: BANK
    label: 银行卡号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 110
    detect:
      - type: regex
        pattern: '(?<!\d)\d(?:[ -]?\d){15,18}(?!\d)'
        validate: luhn
        # 18 位身份证号有时也能通过 Luhn 校验，不能当银行卡换掉
        unless_validate: cn_id_checksum
    replace: {strategy: surrogate}

  - id: cn.phone
    entity: PHONE
    label: 手机号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 100
    detect:
      - type: regex
        pattern: '(?<!\d)1[3-9]\d{9}(?!\d)'
    replace: {strategy: surrogate}

  - id: cn.landline
    entity: PHONE
    label: 固定电话
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 95
    detect:
      - type: regex
        pattern: '(?<!\d)0\d{2,3}[ -]?\d{7,8}(?!\d)'
        # 12 位「发票代码」也是 0 开头连续数字，不能当固定电话换掉
        exclude_near: [发票代码, 发票号码, 发票]
    replace: {strategy: surrogate}

  - id: cn.email
    entity: EMAIL
    label: 电子邮箱
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 92
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9._%+\-])[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
    replace: {strategy: surrogate}

  - id: cn.plate
    entity: PLATE
    label: 车牌号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 90
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])(?:[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼使领][A-HJ-NP-Z][A-HJ-NP-Z0-9]{6}|[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼使领][A-HJ-NP-Z][A-HJ-NP-Z0-9]{5}[挂学警港澳]?)(?![A-Za-z0-9])'
    replace: {strategy: surrogate}

  - id: cn.uscc
    entity: USCC
    label: 统一社会信用代码
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 85
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?=[0-9A-HJ-NPQRTUWXY]{18}(?![0-9A-Za-z]))(?=[0-9A-HJ-NPQRTUWXY]{0,17}[A-HJ-NPQRTUWXY])[0-9A-HJ-NPQRTUWXY]{2}\d{6}[0-9A-HJ-NPQRTUWXY]{10}(?![0-9A-Za-z])'
        # GB 32100-2015 校验位：没有它，18 位执业许可证号/内部编号会被误当 USCC
        validate: uscc_checksum
    replace: {strategy: surrogate}

  # ── 金额 ──
  # 判决书/OCR 里千分位常被排成空格（"930 700.00 元"），空格和逗号都当分隔符；
  # 带空格的写法必须带单位/币种，避免把 "3 034.6M²" 这类编号误当金额。
  - id: cn.amount
    entity: AMOUNT
    label: 金额
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 70
    detect:
      - type: regex
        pattern: '(?<![\d.])(?:(?:人民币|RMB|¥|￥)\s*(?:\d{1,3}(?:[ ,]\d{3})+|\d+)(?:\.\d{1,2})?(?:\s*(?:万元|亿元|元))?|\d{1,3}(?:[ ,]\d{3})+(?:\.\d{1,2})?\s*(?:万元|亿元|元)|\d+(?:\.\d{1,2})?\s*(?:万元|亿元|元))'
    replace: {strategy: surrogate}

  - id: cn.amount_cn
    entity: AMOUNT
    label: 大写金额
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 65
    detect:
      - type: regex
        pattern: '(?<![壹贰叁肆伍陆柒捌玖拾佰仟万亿零元圆整])(?:人民币)?[壹贰叁肆伍陆柒捌玖拾佰仟万亿零]{2,}[元圆](?:整|角|分)?'
    replace: {strategy: surrogate}

  # ── 自由文本里的实体（启发式 NER） ──
  - id: cn.person
    entity: PERSON
    label: 人名
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 55
    detect:
      - type: ner
        types: [person]
    replace: {strategy: surrogate}

  - id: cn.address
    entity: ADDRESS
    label: 地址
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 50
    detect:
      - type: ner
        types: [address]
    replace: {strategy: surrogate}

  # 住址/住所地标签 + 地址（判决书/合同里地址常折成 2–3 行，joined_regex 跨行兜住）
  - id: cn.address_labeled
    entity: ADDRESS
    label: 地址
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 79
    detect:
      - type: regex
        pattern: '(?:住所地|住址|住\s*所\s*地|住\s*址)\s*[:：]?\s*(?P<value>[^。；;，,\n]{6,80}?)(?=[。；;，,]|联系|电话|传真|邮编|法定代表人|负责人|统一社会信用代码|纳税人|身份证|账号|开户|住所地|住址|地址|委托|被告|原告|第三人|本院|审判|$|\\n)'
      - type: joined_regex
        pattern: '(?:住所地|住址|住\s*所\s*地|住\s*址)\s*[:：]?\s*(?P<value>[^。；;，,\n]{6,80}?)(?=[。；;，,]|联系|电话|传真|邮编|法定代表人|负责人|统一社会信用代码|纳税人|身份证|账号|开户|住所地|住址|地址|委托|被告|原告|第三人|本院|审判|$|\\n)'
        max_blocks: 8
    replace: {strategy: surrogate}

  # 无"住址"标签的居住地址：「…村民，住峨边彝族自治县宜坪村水溪子组3号。」
  - id: cn.address_residence
    entity: ADDRESS
    label: 住址
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 77
    detect:
      - type: joined_regex
        # 只抓「，住XX县…」这种居住地址；排除「住址/住所/住房/住院/住户」等词
        pattern: '(?<=[，,；;。])\s*住(?![址所房户宅院持建])(?P<value>[^。；;，,\n]{4,60}?)(?=[。；;，,]|$)'
        max_blocks: 8
    replace: {strategy: surrogate}

  # 联系人 / 经办人 / 负责人 + 姓名（公函/合同落款常见"联系人:王铁栓"）。
  # 只认标签后紧跟的姓名；姓氏表 + 停用词约束避免「详见附件」「见合同」等
  # 说明文字被当人名（负样本见 test_ai2_rules.py）。
  # priority 低于 cn.person(55)：NER 已命中的姓名保留原标签（避免存量样例
  # "人名"计数变化），本规则只补 NER 因不常见名字漏掉的姓名。
  - id: cn.contact_person
    entity: PERSON
    label: 联系人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 54
    detect:
      - type: regex
        pattern: '(?:联系人|经办人|负责人)\s*[:：]\s*(?P<value>(?!(?:详见|见合|附件|文件|公司|个人|单位|集团|法人|法定|代表|当事|被告|原告|第三|双方|甲方|乙方|丙方|我方|贵方|对方|本院|法院|人民|检察|有限|股份|办公室|项目部|财务部|人事部|销售部|技术部|法务部|采购部|工程部|综合部|行政部|待定|同上|如下|另定|电话|手机|邮箱|地址|传真))(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2}))(?=\s|[，。；;、：:（(]|$)'
    replace: {strategy: surrogate}

  - id: cn.org
    entity: ORG
    label: 机构名称
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff, mesh]
    priority: 40
    detect:
      - type: ner
        types: [org]
    replace: {strategy: surrogate}
