# 法律 · 民事诉讼
# 律所/法务场景：案号、执业证号、当事人与代理人、律所与法院名称。
pack: legal-cn
name: 法律 · 民事诉讼
version: 1
include: [common]

rules:
  # 案号：（2023）京0105民初12345号 / （2026）川3423 民再1 号 / 2025 川3423 执136 号
  # 判决书正文里的案号常带 OCR/排版空格，程序类型也很多（民再/民监/执异…），
  # 这里统一放宽空格与类型；跨行案号用 joined_regex 兜住（（2026）\n川3423 民监1 号）。
  - id: cn.case_no
    entity: CASE_NO
    label: 案号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 88
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:（|\(|〔)\s*(?:19|20)\d{2}\s*(?:）|\)|〕)\s*[\u4e00-\u9fa5]{1,4}\s*\d{1,4}\s*(?:民初|民终|民再|民申|民监|民特|民辖终|刑初|刑终|刑申|行初|行终|执异|执复|执恢|执保|执|财保|破申)\s*\d+\s*(?:号)?'
      - type: regex
        pattern: '(?<!\d)(?:19|20)\d{2}\s*[\u4e00-\u9fa5]{1,2}\s*\d{2,4}\s*(?:民初|民终|民再|民申|民监|刑初|刑终|行初|行终|执异|执恢|执保|执)\s*\d+\s*号'
      - type: joined_regex
        pattern: '(?<![0-9A-Za-z])(?:(?:（|\(|〔)\s*(?:19|20)\d{2}\s*(?:）|\)|〕)|(?<!\d)(?:19|20)\d{2})\s*[\u4e00-\u9fa5]{1,4}\s*\d{1,4}\s*(?:民初|民终|民再|民申|民监|民特|民辖终|刑初|刑终|刑申|行初|行终|执异|执复|执恢|执保|执|财保|破申)\s*\d+\s*(?:号)?'
        max_blocks: 8
    replace: {strategy: surrogate}

  # 律所内部案件编号 / 合同编号：［2004］沪建纬（蓉）民代字第393号
  # 手写年份和序号常被 OCR 认成 2ox / 3q3，所以数字位里允许混入字母
  - id: cn.case_ref
    entity: CASE_NO
    label: 案号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 86
    detect:
      - type: regex
        pattern: '(?:[\[［〔（(]\s*[0-9A-Za-z]{2,6}\s*[\]］〕）)]\s*)?[\u4e00-\u9fa5]{2,14}(?:[（(][\u4e00-\u9fa5]{0,6}[）)])?[\u4e00-\u9fa5]{0,6}字\s*第\s*[0-9A-Za-z]{1,8}\s*号'
    replace: {strategy: surrogate}

  # 律师执业证号：17 位数字 + 1 位校验（X/数字）。单看数字无法区分，要求附近有"执业证"字样。
  - id: cn.lawyer_license
    entity: LICENSE
    label: 律师执业证号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 80
    detect:
      - type: regex
        pattern: '(?<!\d)\d{17}[\dXx](?!\d)'
        near: [律师执业证, 执业证号, 执业证, 律师证]
    replace: {strategy: surrogate}

  # 律师事务所
  - id: cn.law_firm
    entity: ORG
    label: 律师事务所
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 78
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[\u4e00-\u9fa5]{2,20}(?:律师事务所|法律服务所)'
        strip_prefix: [患者, 病人, 入住, 就诊于, 就诊, 前往, 送往, 送至, 转入, 转至, 来自,
                       位于, 地处, 委托代理人, 委托, 代理, 聘请, 由, 向, 在, 于, 到,
                       该, 本, 其, 系, 为, 是, 的, 以及, 及, 与]
    replace: {strategy: surrogate}

  # 法院 / 检察院
  - id: cn.court_name
    entity: ORG
    label: 法院/检察院
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 76
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[\u4e00-\u9fa5]{2,20}(?:人民法院|人民检察院|法院|检察院)'
        strip_prefix: [来自, 前往, 送至, 诉至, 起诉至, 向, 在, 于, 到, 由, 该, 本, 其,
                       系, 为, 是, 的, 以及, 及, 与]
    replace: {strategy: surrogate}

  # 当事人 / 委托代理人：只报带"委托/当事/代理/申请/被告/原告…"上下文的姓名。
  - id: cn.legal_party
    entity: PERSON
    label: 当事人/代理人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 75
    detect:
      - type: ner
        types: [person]
        required_hints: [委托, 当事, 代理, 申请, 被告, 原告, 证人, 受害, 嫌疑,
                         法定代表人, 甲方, 乙方, 第三人, 上诉人, 申请人]
    replace: {strategy: surrogate}

  # 当事人 / 被告姓名（确定性并列结构，补 NER 漏检）：
  # 1) 块首收件人列表「包罗、殷莹：」——整块就是"姓名、姓名："，锚定 ^...$，
  #    避免把正文里的「经签字、盖章」「文件、合法」等顿号短语当人名；
  # 2) 「你诉……有限公司、杨尚坤一案」——顿号后 + 姓名 + 一案（公司等词尾由
  #    姓氏表/停用词挡住）。
  # priority 低于 cn.person(55)：NER 已命中的姓名保留原标签，本规则只补漏检。
  - id: legal.party_name
    entity: PERSON
    label: 当事人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 54
    detect:
      - type: regex
        pattern: '^(?P<value>(?!(?:详见|见合|附件|文件|公司|个人|单位|集团|法人|法定|代表|当事|被告|原告|第三|双方|甲方|乙方|丙方|我方|贵方|对方|本院|法院|人民|检察|有限|股份|办公室|项目部|财务部|人事部|销售部|技术部|法务部|采购部|工程部|综合部|行政部|待定|同上|如下|另定|电话|手机|邮箱|地址|传真))(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2}))、(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2})[:：]\s*$'
      - type: regex
        pattern: '^(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2})、(?P<value>(?!(?:详见|见合|附件|文件|公司|个人|单位|集团|法人|法定|代表|当事|被告|原告|第三|双方|甲方|乙方|丙方|我方|贵方|对方|本院|法院|人民|检察|有限|股份|办公室|项目部|财务部|人事部|销售部|技术部|法务部|采购部|工程部|综合部|行政部|待定|同上|如下|另定|电话|手机|邮箱|地址|传真))(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2}))[:：]\s*$'
      - type: regex
        pattern: '(?<=、)(?P<value>(?!(?:详见|见合|附件|文件|公司|个人|单位|集团|法人|法定|代表|当事|被告|原告|第三|双方|甲方|乙方|丙方|我方|贵方|对方|本院|法院|人民|检察|有限|股份|办公室|项目部|财务部|人事部|销售部|技术部|法务部|采购部|工程部|综合部|行政部|待定|同上|如下|另定|电话|手机|邮箱|地址|传真))(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2}))(?=一案)'
      - type: regex
        pattern: '(?<=诉)(?P<value>(?!(?:详见|见合|附件|文件|公司|个人|单位|集团|法人|法定|代表|当事|被告|原告|第三|双方|甲方|乙方|丙方|我方|贵方|对方|本院|法院|人民|检察|有限|股份|办公室|项目部|财务部|人事部|销售部|技术部|法务部|采购部|工程部|综合部|行政部|待定|同上|如下|另定|电话|手机|邮箱|地址|传真))(?:(?:欧阳|司马|上官|诸葛|东方|皇甫|尉迟|公孙|慕容|长孙|宇文|司徒|司空|令狐|夏侯|独孤|赫连|澹台|公冶|申屠|太史|端木|钟离|闾丘|鲜于|拓跋|呼延|百里|东郭|万俟|闻人|轩辕|西门)[\u4e00-\u9fa5]{1,2}|[赵钱孙李周吴郑王冯陈蒋沈韩杨朱秦许何吕施张孔曹严华金魏陶姜谢邹苏潘范彭鲁韦马苗方俞任袁柳史唐薛雷贺倪汤殷罗毕郝安常于傅齐康伍余顾孟黄和穆萧尹姚邵汪毛米戴宋庞熊纪舒屈项祝董梁杜阮蓝闵席季贾路娄危江童颜郭梅盛林钟徐邱骆高夏蔡田樊胡凌霍万卢莫房解应宗丁邓郁单杭洪包诸左石崔吉龚程邢裴陆荣翁荀羊惠][\u4e00-\u9fa5]{1,2}))(?=一案)'
    replace: {strategy: surrogate}

  # ── 判决书/文书里的「标签 + 姓名」──
  # NER 的上下文窗口只有十来个字，"委托诉讼代理人（特别授权）：杨超" 这种
  # 中间隔了括号的写法会漏；这里用确定性标签规则兜底（标签出现即认定为姓名）。
  - id: legal.agent_name
    entity: PERSON
    label: 委托诉讼代理人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 84
    detect:
      - type: regex
        pattern: '(?:委托诉讼代理人|委托代理人|诉讼代理人|辩护人)\s*(?:[（(][^（）()\n]{0,12}[）)])?\s*[:：]?\s*(?P<value>[\u4e00-\u9fa5]{2,4})(?=[，。；;、：:）)（(\s]|$)'
    replace: {strategy: surrogate}

  # 法定代表人 / 法人代表人（OCR 常见写法）/ 法人代表 / 法定代理人
  - id: legal.rep_name
    entity: PERSON
    label: 法定代表人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 84
    detect:
      - type: regex
        pattern: '(?:法定代表人|法人代表人|法人代表|法定代理人)\s*(?:[（(][^（）()\n]{0,12}[）)])?\s*[:：；;]\s*(?P<value>[\u4e00-\u9fa5]{2,4})(?=[，。；;、：:）)（(\s]|$)'
    replace: {strategy: surrogate}

  # 审判长 / 审判员 / 书记员等落款：姓名可能换行，甚至被竖排拆成单字
  # （"审判员\n何\n荐"），用 value_clean=collapse_ws 拼回一个姓名。
  - id: legal.judge_name
    entity: PERSON
    label: 审判人员
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 84
    detect:
      - type: regex
        pattern: '(?:审判长|审判员|书记员|法官助理|人民陪审员)\s*[:：]?\s*(?P<value>[\u4e00-\u9fa5](?:[ \t]*\n?[ \t]*[\u4e00-\u9fa5]){1,3})(?=\s*$|[，。；;、])'
        value_clean: collapse_ws
      # 跨行：标签和姓名被切成两块（"审判员" / "李树清"）
      - type: joined_regex
        pattern: '(?:审判长|审判员|书记员|法官助理|人民陪审员)\s*[:：]?\s*(?P<value>[\u4e00-\u9fa5](?:[ \t]*\n?[ \t]*[\u4e00-\u9fa5]){1,3})(?=\s*$|[，。；;、])'
        value_clean: collapse_ws
        max_blocks: 3
    replace: {strategy: surrogate}

  # 护照号（P1.5）：普通电子护照 E+8位、旧版 G、公务 D/S、外交 P；只认标签附近，
  # 避免与普通编号/合同号混淆。假值由 surrogate 生成（保形由通用工厂处理）。
  - id: cn.passport_no
    entity: PASSPORT
    label: 护照号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 85
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])(?:E[A-Z0-9]\d{7}|[EGDSP]\d{8})(?![A-Za-z0-9])'
        near: [护照, 护照号, 护照号码, 旅行证件, passport, Passport, PASSPORT]
    replace: {strategy: surrogate}
