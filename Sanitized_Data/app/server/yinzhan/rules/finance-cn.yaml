# 财务 · 账号与额度
# 对账单/流水/授信文件：账号、客户号、额度、流水号、IBAN。
pack: finance-cn
name: 财务 · 账号与额度
version: 1
include: [common]

rules:
  # 银行账号（8–31 位数字，允许空格/短横线分组）
  - id: cn.bank_account
    entity: ACCOUNT
    label: 银行账号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 105
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:银行账号|银行帐号|账号|帐号|账户号|账户|帐户)\s*[:：]?\s*\d[\d \-]{7,30}'
    replace: {strategy: surrogate}

  # 客户号 / 客户编号
  - id: cn.customer_no
    entity: CUSTOMER_NO
    label: 客户号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 72
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:客户号|客户编号|客户代码|客户ID|客户账号|客户帐号|会员号)\s*[:：]?\s*[A-Za-z0-9][A-Za-z0-9\-_]{3,23}'
    replace: {strategy: surrogate}

  # 授信额度 / 余额 / 交易金额：保形浮动 ±25%
  - id: cn.credit_line
    entity: CREDIT_LINE
    label: 授信额度/余额
    level: L2
    scope: [pdf, docx, xlsx, text]
    priority: 82
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:授信额度|授信金额|信用额度|贷款金额|贷款余额|账户余额|交易金额|转账金额|余额|金额)\s*[:：]?\s*(?:人民币|RMB|¥|￥)?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\s*(?:万元|亿元|元)'
    replace: {strategy: surrogate}

  # 交易流水号 / 凭证号 / 订单号
  - id: cn.txn_no
    entity: TXN_NO
    label: 交易流水号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 75
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:交易流水号|流水号|交易编号|交易序号|凭证号|订单号|回单号|参考号)\s*[:：]?\s*[A-Za-z0-9][A-Za-z0-9\-_]{5,31}'
    replace: {strategy: surrogate}

  # IBAN 国际银行账号：mod 97 校验，误报极低
  - id: cn.iban
    entity: IBAN
    label: 国际银行账号
    level: L3
    scope: [pdf, docx, xlsx, text]
    priority: 100
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[A-Z]{2}\d{2}[A-Z0-9]{11,30}(?![A-Za-z0-9])'
        validate: iban
    replace: {strategy: surrogate}
