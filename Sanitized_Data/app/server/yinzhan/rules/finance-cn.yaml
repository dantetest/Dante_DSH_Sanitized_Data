# 财务 · 账号 / 工商登记 / 发票 / 审计（v2，P0）
# 写作用域：财务域（docs/red-lines.md 扩展点 E4）；common.yaml / 其它包不动。
# v1 的 5 条规则（银行账号/客户号/授信额度/交易流水号/IBAN）行为保持不变；
# v2 新增工商登记、发票、SWIFT、开户许可证、审计报告、合同等编号规则。
#
# 约定：
# - 编号类规则一律配 validate（detectors/finance_validators.py），拿不准就
#   返回 False（宁可漏不可错）；无校验位的靠 near 上下文压误报。
# - strip_prefix 让实体 value 只保留"纯编号/纯名称"，替换时标签原样留在正文。
# - 金额不在这里加规则：现有 common 的 cn.amount / finance-cn 的 cn.credit_line
#   已覆盖文本金额；一致性缩放由 replacers/amount_consistency.py 在管线后处理。
pack: finance-cn
name: 财务 · 账号/工商/发票/审计
version: 2
include: [common]

rules:
  # ═══════════ v1 既有规则（行为保持不变） ═══════════

  # 银行账号（8–31 位数字，允许空格/短横线分组）
  - id: cn.bank_account
    entity: ACCOUNT
    label: 银行账号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 105
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:银行账号|银行帐号|账号|帐号|账户号|账户|帐户)\s*[:：]?\s*\d[\d \-]{7,30}'
    replace: {strategy: surrogate}

  # 客户号 / 客户编号
  - id: cn.customer_no
    entity: CUSTOMER_NO
    label: 客户号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 72
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:客户号|客户编号|客户代码|客户ID|客户账号|客户帐号|会员号)\s*[:：]?\s*[A-Za-z0-9][A-Za-z0-9\-_]{3,23}'
    replace: {strategy: surrogate}

  # 授信额度 / 余额 / 交易金额：文本金额（一致性缩放在 replacers/amount_consistency.py）
  - id: cn.credit_line
    entity: CREDIT_LINE
    label: 授信额度/余额
    level: L2
    scope: [pdf, docx, xlsx, text]
    priority: 82
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:授信额度|授信金额|信用额度|贷款金额|贷款余额|账户余额|交易金额|转账金额|余额|金额)\s*[:：]?\s*(?:人民币|RMB|¥|￥)?\s*\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?\s*(?:万元|亿元|元)'
    replace: {strategy: surrogate}

  # 交易流水号 / 凭证号 / 订单号
  - id: cn.txn_no
    entity: TXN_NO
    label: 交易流水号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 75
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])(?:交易流水号|流水号|交易编号|交易序号|凭证号|订单号|回单号|参考号)\s*[:：]?\s*[A-Za-z0-9][A-Za-z0-9\-_]{5,31}'
    replace: {strategy: surrogate}

  # IBAN 国际银行账号：mod 97 校验，误报极低
  - id: cn.iban
    entity: IBAN
    label: 国际银行账号
    level: L3
    scope: [pdf, docx, xlsx, text]
    priority: 100
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[A-Z]{2}\d{2}[A-Z0-9]{11,30}(?![A-Za-z0-9])'
        validate: iban
    replace: {strategy: surrogate}

  # ═══════════ v2 新增：工商登记主体 ═══════════

  # 工商注册号（三证合一前，15 位，无校验位，必须靠上下文）
  - id: cn.biz_reg_no
    entity: BIZ_REG_NO
    label: 工商注册号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 84
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])\d{15}(?![0-9A-Za-z])'
        near: [工商注册号, 注册号, 营业执照号, 执照注册号, 企业注册号]
        near_before: 16
        near_after: 4
        validate: fin_business_reg_no
    replace: {strategy: surrogate}

  # 组织机构代码（GB 11714，8+1 校验位，可带连字符）
  - id: cn.org_code
    entity: ORG_CODE
    label: 组织机构代码
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 83
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[0-9A-Z]{8}-[0-9A-Z](?![0-9A-Za-z])'
        near: [组织机构代码, 组织代码, 机构代码, 代码证]
        validate: fin_org_code
      - type: regex
        pattern: '(?<![0-9A-Za-z])[0-9A-Z]{9}(?![0-9A-Za-z])'
        near: [组织机构代码, 组织代码, 机构代码, 代码证]
        validate: fin_org_code
    replace: {strategy: surrogate}

  # 纳税人识别号（18 位=USCC / 15 位旧税号 / 17、20 位特殊号）
  - id: cn.tax_no
    entity: TAX_NO
    label: 纳税人识别号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 82
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])[0-9A-HJ-NPQRTUWXY]{15,20}(?![0-9A-Za-z])'
        near: [纳税人识别号, 纳税人识别, 税号, 统一社会信用代码]
        near_before: 20
        near_after: 4
        validate: fin_tax_no
    replace: {strategy: surrogate}

  # 法定代表人（强锚点，避免把正文普通姓名都当法人）
  - id: cn.legal_rep
    entity: PERSON
    label: 法定代表人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 81
    detect:
      - type: regex
        pattern: '(?:法定代表人|法人代表|法定代表)\s*[:：]?\s*[\u4e00-\u9fa5]{2,4}'
        strip_prefix: [法定代表人, 法人代表, 法定代表, '：', ':']
    replace: {strategy: surrogate}

  # 注册地址 / 住所（地址实体的强锚点）
  - id: cn.reg_address
    entity: ADDRESS
    label: 注册地址
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 80
    detect:
      - type: regex
        pattern: '(?:注册地址|住所|经营场所|主要经营场所|办公地址)\s*[:：]?\s*[^\n\r；;，,]{6,60}'
        strip_prefix: [注册地址, 住所, 经营场所, 主要经营场所, 办公地址, '：', ':']
    replace: {strategy: surrogate}

  # 营业执照编号 / 证照编号（允许副本 (1/1) 结构）
  - id: cn.license_no
    entity: LICENSE_NO
    label: 营业执照编号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 79
    detect:
      - type: regex
        pattern: '(?:营业执照编号|执照编号|证照编号|许可证编号)\s*[:：]?\s*[0-9A-Za-z（）()／/\-]{6,30}'
        strip_prefix: [营业执照编号, 执照编号, 证照编号, 许可证编号, '：', ':']
    replace: {strategy: surrogate}

  # 注册资本：公开信息 L1，默认保留（可改成 surrogate 参与金额组缩放）
  - id: cn.reg_capital
    entity: AMOUNT
    label: 注册资本
    level: L1
    scope: [pdf, docx, xlsx, text]
    priority: 78
    detect:
      - type: regex
        pattern: '(?:注册资本|注册资金)\s*[:：]?\s*(?:人民币|RMB)?\s*\d[\d,.]*\s*(?:万元|亿元|元)'
        strip_prefix: [注册资本, 注册资金, '：', ':']
    replace: {strategy: keep}

  # ═══════════ v2 新增：银行与支付 ═══════════

  # 开户许可证核准号 / 基本存款账户编号：J + 13 位（合计 14 位）
  - id: cn.account_license_no
    entity: ACCOUNT_LICENSE
    label: 开户许可证核准号
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 106
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])J[0-9A-Z]{13}(?![0-9A-Za-z])'
        near: [开户许可证, 核准号, 基本存款账户, 账户编号, 开户核准]
        near_before: 20
        near_after: 6
        validate: fin_account_license
    replace: {strategy: surrogate}

  # SWIFT/BIC（ISO 9362：8 或 11 位）
  - id: cn.swift_bic
    entity: SWIFT_BIC
    label: SWIFT/BIC
    level: L3
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 105
    detect:
      - type: regex
        pattern: '(?<![A-Za-z0-9])[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?(?![A-Za-z0-9])'
        near: [SWIFT, BIC, 银行代码, 国际汇款, 电汇]
        near_before: 20
        near_after: 6
        validate: fin_swift_bic
    replace: {strategy: surrogate}

  # 联行号 / 支付系统行号（12 位，弱特征，必须靠上下文）
  - id: cn.bank_routing_no
    entity: ROUTING_NO
    label: 联行号
    level: L2
    scope: [pdf, docx, xlsx, text]
    priority: 77
    detect:
      - type: regex
        pattern: '(?<![0-9A-Za-z])\d{12}(?![0-9A-Za-z])'
        near: [联行号, 支付系统行号, 大额行号, 小额行号, 行号]
    replace: {strategy: surrogate}

  # 支付平台账号 / 商户号（支付宝/微信/银联等）
  - id: cn.pay_platform_id
    entity: PAY_ID
    label: 支付平台账号/商户号
    level: L3
    scope: [pdf, docx, xlsx, text]
    priority: 76
    detect:
      - type: regex
        pattern: '(?:商户号|商户编号|支付宝账号|微信支付|收款账号)\s*[:：]?\s*[0-9A-Za-z]{6,32}'
        strip_prefix: [商户号, 商户编号, 支付宝账号, 微信支付, 收款账号, '：', ':']
    replace: {strategy: surrogate}

  # ═══════════ v2 新增：发票 ═══════════

  # 发票代码：12 位（电子票，结构可校验）或 10 位（历史/纸质票种）
  - id: cn.invoice_code
    entity: INVOICE_CODE
    label: 发票代码
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 108
    detect:
      - type: regex
        pattern: '(?:发票代码)\s*[:：]?\s*(0\d{11}|\d{10})(?![0-9])'
        strip_prefix: [发票代码, '：', ':']
        validate: fin_invoice_code
    replace: {strategy: surrogate}

  # 发票号码：8 位（按年度、批次编制，无校验位）
  - id: cn.invoice_no
    entity: INVOICE_NO
    label: 发票号码
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 107
    detect:
      - type: regex
        pattern: '(?:发票号码|发票号)\s*[:：]?\s*\d{8}(?![0-9])'
        strip_prefix: [发票号码, 发票号, '：', ':']
        validate: fin_invoice_no
    replace: {strategy: surrogate}

  # 开票人 / 收款人 / 复核人（人名强锚点）
  - id: cn.invoice_person
    entity: PERSON
    label: 开票人
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 75
    detect:
      - type: regex
        pattern: '(?:开票人|收款人|复核人|经办人)\s*[:：]?\s*[\u4e00-\u9fa5]{2,4}'
        strip_prefix: [开票人, 收款人, 复核人, 经办人, '：', ':']
    replace: {strategy: surrogate}

  # ═══════════ v2 新增：合同 / 审计 ═══════════

  # 合同编号 / 协议编号
  - id: cn.contract_no
    entity: CONTRACT_NO
    label: 合同编号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 74
    detect:
      - type: regex
        pattern: '(?:合同编号|合同号|协议编号|协议号|合同编码)\s*[:：]?\s*[0-9A-Za-z\-_（）()／/]{4,32}'
        strip_prefix: [合同编号, 合同号, 协议编号, 协议号, 合同编码, '：', ':']
    replace: {strategy: surrogate}

  # 审计报告编号（各家事务所格式不一，无统一校验位，靠 near + 结构校验）
  - id: cn.audit_report_no
    entity: AUDIT_NO
    label: 审计报告编号
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 73
    detect:
      - type: regex
        pattern: '(?:审计报告编号|报告编号|报告编码|报告号)\s*[:：]?\s*[^\s，。；;]{4,40}'
        strip_prefix: [审计报告编号, 报告编号, 报告编码, 报告号, '：', ':']
        validate: fin_audit_report_no
    replace: {strategy: surrogate}

  # 签字注册会计师 / 审计人员（人名强锚点）
  - id: cn.audit_cpa
    entity: PERSON
    label: 签字注册会计师
    level: L2
    scope: [pdf, docx, xlsx, text, image, tiff]
    priority: 72
    detect:
      - type: regex
        pattern: '(?:签字注册会计师|签字注会|注册会计师|审计人员)\s*[:：]?\s*[\u4e00-\u9fa5]{2,4}'
        strip_prefix: [签字注册会计师, 签字注会, 注册会计师, 审计人员, '：', ':']
    replace: {strategy: surrogate}

# TODO（P1，见 docs/impl/finance.md）：
# - 英文公司名换名（需 surrogate 增加英文 ORG 工厂；本批不改 surrogate.py）；
# - 发票「金额/税额/价税合计」角色标记（amount_role: line/tax/total）与
#   表格纯数值金额检测器（需 Lead 在管线/解析器层扩展）；
# - 银行流水「期初+发生额=余额」余额链重算（P0 只保证同值同映射 + 同因子缩放）。
